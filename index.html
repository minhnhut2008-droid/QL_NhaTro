<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<title>Quản lý nhà trọ</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f6e5a"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f1;--sf:#fff;--ink:#16231f;--mu:#5d6f69;--ln:#d5dedb;--pr:#0f6e5a;--pr2:#dff0ec;--am:#d9a21b;--am2:#fbf0d2;--rd:#c4423b;--rd2:#f9e0de;--gn2:#e3f1e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1815;--sf:#18241f;--ink:#e6efec;--mu:#98aba5;--ln:#2b3b36;--pr:#4cc2a5;--pr2:#17332c;--am:#e8b53a;--am2:#3a3015;--rd:#ef7a73;--rd2:#3d1f1d;--gn2:#1e3320}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Be Vietnam Pro",system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
header{padding:12px 16px 8px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1}header small{color:var(--mu)}
main{flex:1;overflow-y:auto;padding:4px 14px 16px}
nav{display:flex;background:var(--sf);border-top:1px solid var(--ln)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:9px 2px 8px;font:inherit;font-size:11.5px;cursor:pointer}
nav button b{display:block;font-size:19px;font-weight:400}
nav button.on{color:var(--pr);font-weight:700;box-shadow:inset 0 2px var(--pr)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px}
.stat b{font-size:26px;display:block;line-height:1.1}.stat span{color:var(--mu);font-size:12.5px}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12.5px}
.bar i{flex:0 0 105px;font-style:normal;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar u{height:14px;background:var(--pr);border-radius:3px;display:block;text-decoration:none}
.donut{width:92px;height:92px;border-radius:50%;flex:none;position:relative}
.donut:after{content:"";position:absolute;inset:22px;background:var(--sf);border-radius:50%}
.row{display:flex;align-items:center;gap:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
.chip{flex:none;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:18px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--pr);border-color:var(--pr);color:#fff}
.seg{display:flex;border:1px solid var(--ln);border-radius:8px;overflow:hidden;margin-bottom:8px}
.seg button{flex:1;border:0;background:var(--sf);color:var(--ink);padding:7px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--pr);color:#fff}
.rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.room{border:1.5px solid var(--ln);border-radius:8px;padding:8px;background:var(--sf);color:var(--ink);text-align:left;font:inherit;font-size:12.5px;min-height:74px;cursor:pointer}
.room b{font-size:15px;display:block}
.room.has{background:var(--pr2);border-color:var(--pr)}
.room.nodc{border-color:var(--rd);background:var(--rd2)}
.room.flag{box-shadow:inset 4px 0 var(--am)}
.room.empty{color:var(--mu);border-style:dashed}
.p{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.p:last-child{border:0}.p.flag{background:var(--am2);margin:0 -12px;padding:10px 12px;border-left:4px solid var(--am)}
.av{width:36px;height:36px;border-radius:50%;background:var(--pr2);color:var(--pr);display:grid;place-items:center;font-weight:700;flex:none}
.p div.t{flex:1;min-width:0}.p small{color:var(--mu);display:block}
.tag{display:inline-block;font-size:11px;border-radius:4px;padding:1px 6px;margin-right:4px}
.t-ok{background:var(--gn2);color:var(--pr)}.t-no{background:var(--rd2);color:var(--rd)}.t-fl{background:var(--am2);color:var(--am)}
.btn{border:0;background:var(--pr);color:#fff;border-radius:8px;padding:10px 14px;font:inherit;font-weight:500;cursor:pointer}
.btn.o{background:none;color:var(--pr);border:1px solid var(--pr)}.btn.w{width:100%;margin-top:8px}
label{display:block;font-size:12.5px;color:var(--mu);margin:8px 0 3px}
select,input,textarea{width:100%;font:inherit;padding:8px;border:1px solid var(--ln);border-radius:8px;background:var(--sf);color:var(--ink)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet.on{display:flex}.sheet>div{background:var(--bg);width:100%;max-width:520px;max-height:88%;overflow-y:auto;border-radius:14px 14px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px))}
.tl{border-left:2px solid var(--ln);margin-left:6px;padding-left:12px}.tl div{margin-bottom:8px;font-size:13px;position:relative}
.tl div:before{content:"";position:absolute;left:-18px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--pr)}
table{width:100%;border-collapse:collapse;font-size:12.5px}td,th{padding:5px 4px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:middle}
td select{padding:3px;font-size:12px}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13px;display:none;z-index:20}
.sc{aspect-ratio:1.6;border:2px dashed var(--pr);border-radius:12px;display:grid;place-items:center;color:var(--mu);text-align:center;margin-bottom:8px}
.ok{color:var(--pr)}.bad{color:var(--rd)}
</style></head><body>
<div id="app"><header><h1 id="ttl">Tổng quan</h1><small>Lưu trên máy · chạy offline</small></header><main id="main"></main>
<nav id="nav"></nav></div>
<div class="sheet" id="sh"><div id="shc"></div></div><div class="toast" id="ts"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
const H=[["Nhà trọ Hoa Mai",8],["Nhà trọ Bình An",6],["Nhà nghỉ Sao Mai",9],["Nhà cho thuê Phú Gia",6]];
const T="Tạm trú",K="Khai báo nơi ở hiện tại";
const CAT={"Đắk Lắk":["Xã Tân Lập","Phường Ea Kao","Xã Cư Êbur"],"Đồng Nai":["Xã Bình Hòa","Phường Tân Hiệp","Xã Phú Lý"],"An Giang":["Phường Long Xuyên","Xã Mỹ Hòa Hưng"],"Tây Ninh":["Xã Long Thuận","Phường Gia Lộc"],"Thành phố Hồ Chí Minh":["Phường Bến Thành","Xã Bình Chánh"]};
const ptype=p=>p.startsWith("Thành phố")?"":"Tỉnh ";
let P=[
["Nguyễn Văn Hùng","066201012345","12/03/2001","Nam",0,1,T,1,0,"","Ấp 3, Xã Bình Hòa, Tỉnh Đồng Nai"],
["Trần Thị Mai","079199008761","25/07/1999","Nữ",0,1,K,1,0,"","Xã Tân Lập, Tỉnh Đắk Lắk"],
["Lê Quốc Bảo","086203004412","02/11/2003","Nam",0,2,T,0,1,"Giấy tờ chưa đủ, cần nhắc","Xã Cư Êbur, Tỉnh Đắk Lắk"],
["Phạm Thanh Tùng","072198003377","09/05/1998","Nam",1,1,T,1,0,"","Xã Long Thuận, Tỉnh Tây Ninh"],
["Võ Thị Lan","048200005519","30/01/2000","Nữ",1,1,T,0,0,"","Phường Long Xuyên, Tỉnh An Giang"],
["Đặng Minh Khoa","064202007788","17/09/2002","Nam",1,3,K,1,0,"","Phường Ea Kao, Tỉnh Đắk Lắk"],
["Hoàng Anh Thư","092199011234","11/12/1999","Nữ",2,4,T,0,1,"Từng ở nhiều nhà trọ","Phường Bến Thành, Thành phố Hồ Chí Minh"],
["Bùi Văn Nam","075197006621","05/06/1997","Nam",2,4,T,1,0,"","Xã Phú Lý, Tỉnh Đồng Nai"],
["Ngô Thị Hạnh","051201009900","21/04/2001","Nữ",2,7,K,0,0,"","Phường Gia Lộc, Tỉnh Tây Ninh"],
["Đỗ Quang Vinh","038200003210","14/08/2000","Nam",3,1,T,1,0,"","Xã Mỹ Hòa Hưng, Tỉnh An Giang"],
["Mai Thị Cúc","080199004455","03/03/1999","Nữ",3,2,K,0,0,"","Xã Bình Chánh, Thành phố Hồ Chí Minh"]
].map((a,i)=>({id:i,n:a[0],cc:a[1],dob:a[2],g:a[3],h:a[4],r:a[5],loai:a[6],dc:!!a[7],fl:!!a[8],note:a[9],ad:a[10],tt:"Đang cư trú",hist:[{d:"01/09/2026",t:"Đến "+H[a[4]][0]+", phòng P"+a[5]}]}));
P.push({id:11,n:"Trương Văn Đức",cc:"070200008899",dob:"08/02/2000",g:"Nam",h:0,r:3,loai:T,dc:true,fl:false,note:"",ad:"Xã Tân Lập, Tỉnh Đắk Lắk",tt:"Đã rời đi",hist:[{d:"01/06/2026",t:"Đến Nhà trọ Hoa Mai, phòng P3"},{d:"30/09/2026",t:"Rời đi"}]});
try{const d=JSON.parse(localStorage.getItem('nt_v1')||'null');if(d&&d.P&&d.H){H.length=0;d.H.forEach(x=>H.push(x));P=d.P}}catch(e){}
function save(){try{localStorage.setItem('nt_v1',JSON.stringify({H,P}))}catch(e){}}
let S={sel:new Set(),open:false,q:'',pq:'',tab:0,h:0,view:"map",dcT:0,order:"pre",scan:null,xl:null,xlI:0};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/gi,"d").toLowerCase().replace(/[^a-z0-9, ]/g," ").replace(/\s+/g," ");
const strip=s=>norm(s).replace(/^(xa|phuong|dac khu|tinh|thanh pho|tp|t|x|p)\s+/,"");
function addr(raw){const n=norm(raw);let pv=null,xa=null,miss=[];
for(const k in CAT)if(n.includes(strip(k))){pv=k;break}
if(pv)for(const x of CAT[pv])if(n.includes(strip(x))){xa=x;break}
const rest=raw.split(",").map(s=>s.trim()).filter(s=>s&&(!pv||!norm(s).includes(strip(pv)))&&(!xa||!norm(s).includes(strip(xa))));
if(!pv)miss.push("Tỉnh/Thành phố");if(!xa)miss.push("Xã/Phường/Đặc khu");
return{pv:pv?ptype(pv)+pv:"",xa:xa||"",rest:rest.join(", "),miss,full:[rest.join(", "),xa,pv?ptype(pv)+pv:""].filter(Boolean).join(", "),raw}}
const inH=h=>P.filter(p=>p.h==h&&p.tt=="Đang cư trú"),act=()=>P.filter(p=>p.tt=="Đang cư trú");
function toast(t){const e=$("#ts");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2200)}
function open_(h){$("#shc").innerHTML=h;$("#sh").classList.add("on")}
function close_(){$("#sh").classList.remove("on")}
$("#sh").onclick=e=>{if(e.target.id=="sh")close_()};
const TABS=[["▦","Tổng quan"],["⌂","Nhà trọ"],["⌗","Quét CCCD"],["⇩","Nhập Excel"],["✓","Hệ thống DC"]];
function nav(){$("#nav").innerHTML=TABS.map((t,i)=>`<button class="${S.tab==i?"on":""}" onclick="go(${i})"><b>${t[0]}</b>${t[1]}</button>`).join("")}
function go(i){S.tab=i;render()}
function render(){save();nav();$("#ttl").textContent=TABS[S.tab][1];$("#main").innerHTML=[vDash,vHouse,vScan,vXl,vDc][S.tab]();$("#main").scrollTop=0;if(S.tab==4)updC()}
function vDash(){const a=act(),nd=a.filter(p=>!p.dc).length,fl=a.filter(p=>p.fl).length,t=a.filter(p=>p.loai==T).length,k=a.length-t;
const mx=Math.max(...H.map((_,i)=>inH(i).length));
return `<div class="grid"><div class="stat"><b>${a.length}</b><span>Người đang cư trú</span></div><div class="stat"><b>${H.length}</b><span>Nhà trọ (mẫu)</span></div>
<div class="stat" style="border-color:var(--rd)"><b class="bad">${nd}</b><span>Chưa nhập hệ thống DC</span></div><div class="stat" style="border-color:var(--am)"><b>${fl}</b><span>Đang được đánh dấu</span></div></div>
<div class="card" style="margin-top:10px"><h3>Số người theo nhà trọ</h3>${H.map((h,i)=>`<div class="bar"><i>${h[0]}</i><u style="width:${inH(i).length/mx*100}%"></u>${inH(i).length}</div>`).join("")}</div>
<div class="card"><h3>Loại cư trú</h3><div class="row"><div class="donut" style="background:conic-gradient(var(--pr) 0 ${t/(a.length||1)*100}%,var(--am) 0)"></div><div style="font-size:13px"><span class="tag t-ok">Tạm trú</span> ${t} người<br><span class="tag t-fl">Khai báo nơi ở hiện tại</span> ${k} người</div></div></div>
<div class="card"><h3>Đã nhập hệ thống DC theo nhà trọ</h3>${H.map((h,i)=>{const l=inH(i),d=l.filter(p=>p.dc).length;return `<div class="bar"><i>${h[0]}</i><u style="width:${l.length?d/l.length*100:0}%;background:var(--am)"></u>${d}/${l.length}</div>`}).join("")}</div>
<button class="btn w o" onclick="alert('Bản thật sẽ xuất Excel, Word, PDF theo bộ lọc.')">Xuất danh sách (Excel / Word / PDF)</button><button class="btn w o" style="color:var(--rd);border-color:var(--rd)" onclick="resetAll()">Xóa dữ liệu mẫu, bắt đầu dùng thật</button>`}
function mkAddr(r,g){const w={pv:g(r,'pv'),xa:g(r,'xa'),ap:g(r,'ap'),ct:g(r,'ct')},one=g(r,'addr');if(!w.pv&&!w.xa&&!w.ap&&!w.ct){const a=addr(one);return{pv:a.pv,xa:a.xa,ap:'',ct:a.rest,full:a.full||one}}const a=addr([w.ct,w.ap,w.xa,w.pv].filter(Boolean).join(', '));const pv=a.pv||w.pv,xa=a.xa||w.xa;return{pv,xa,ap:w.ap,ct:w.ct,full:[w.ct,w.ap,xa,pv].filter(Boolean).join(', ')}}
function nd(s){s=String(s||'').trim();const m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);if(!m)return s;let a=+m[1],b=+m[2],y=m[3],d,mo;const sh=y.length<4;if(sh)y=(+y<=26?2000:1900)+ +y;if(b>12){mo=a;d=b}else if(a>12){d=a;mo=b}else if(sh){mo=a;d=b}else{d=a;mo=b}return String(d).padStart(2,'0')+'/'+String(mo).padStart(2,'0')+'/'+y}
function htype(i){const t=H[i][2];if(t)return t;const n=norm(H[i][0]);return /nghi/.test(n)?'Nhà nghỉ':/cho thue/.test(n)?'Nhà cho thuê':'Nhà trọ'}
function normHt(s){const n=norm(s);return /nghi/.test(n)?'Nhà nghỉ':/thue/.test(n)?'Nhà cho thuê':/tro/.test(n)?'Nhà trọ':''}
function pr(p,show,sel){const on=S.sel.has(p.id);return `<div class='p ${p.fl?'flag':''}' onclick='detail(${p.id})'>${sel?`<input type='checkbox' ${on?'checked':''} onclick='event.stopPropagation()' onchange='tsel(${p.id},this.checked)' style='width:20px;height:20px;margin-top:8px;flex:none'>`:''}<div class='av'>${p.n.split(' ').pop()[0]}</div><div class='t'><b>${esc(p.n)}</b>${p.fl?' ⚠️':''}<small>${p.g} · ${nd(p.dob)} · ${p.cc.slice(0,3)}•••••${p.cc.slice(-3)}</small><small>${show&&p.r?'P'+p.r+' · ':''}${p.loai}</small><span class='tag ${p.dc?'t-ok':'t-no'}'>${p.dc?'Đã nhập DC':'Chưa nhập DC'}</span>${p.note?`<small>📝 ${esc(p.note)}</small>`:''}</div></div>`}
function keep(f){const m=$('#main'),st=m.scrollTop;f();m.scrollTop=st}
function tsel(id,on){on?S.sel.add(id):S.sel.delete(id);keep(render)}
function plist(){const q=norm(S.pq||'');return inH(S.h).filter(p=>!q||norm(p.n+' '+p.cc+' p'+p.r).includes(q)).sort((a,b)=>(a.r||99)-(b.r||99))}
function plHtml(){return plist().map(p=>pr(p,1,true)).join('')||'Không có kết quả.'}
function selAll(on){plist().forEach(p=>on?S.sel.add(p.id):S.sel.delete(p.id));keep(render)}
function bulkAct(k){if(!S.sel.size)return toast('Chọn ít nhất một người');const n=S.sel.size;if(k=='exp')return toast('Demo: xuất '+n+' người ra Excel/Word/PDF');P.forEach(p=>{if(!S.sel.has(p.id))return;if(k=='dc')p.dc=true;if(k=='fl')p.fl=true;if(k=='out'){p.tt='Đã rời đi';p.hist.push({d:'17/10/2026',t:'Rời đi'})}});S.sel=new Set();render();toast('Đã cập nhật '+n+' người')}
function prOld(p,show){return `<div class="p ${p.fl?"flag":""}" onclick="detail(${p.id})"><div class="av">${p.n.split(" ").pop()[0]}</div><div class="t"><b>${esc(p.n)}</b>${p.fl?" ⚠️":""}<small>${show?"Phòng P"+p.r+" · ":""}${p.cc.slice(0,3)}•••••${p.cc.slice(-3)} · ${p.loai==T?"Tạm trú":"Khai báo"}</small><span class="tag ${p.dc?"t-ok":"t-no"}">${p.dc?"Đã nhập DC":"Chưa nhập DC"}</span>${p.note?`<small>📝 ${esc(p.note)}</small>`:""}</div></div>`}
function vHouse(){return S.open?vHOpen():vHList()}
function openH(i){S.h=i;S.open=true;S.sel=new Set();S.pq='';render()}
function hl(){const q=norm(S.q||'');return H.map((h,i)=>i).filter(i=>!q||norm(H[i][0]).includes(q)).map(i=>{const l=inH(i),x=l.filter(p=>!p.dc).length;return `<div class='card' style='cursor:pointer;display:flex;gap:10px;align-items:center' onclick='openH(${i})'><b style='width:28px;color:var(--mu)'>${i+1}.</b><div style='flex:1'><b>${esc(H[i][0])}</b><small style='display:block;color:var(--mu)'>${htype(i)} · ${H[i][1]} phòng · ${l.length} người</small></div>${x?`<span class='tag t-no'>${x} chưa DC</span>`:''}</div>`}).join('')||'Không tìm thấy nhà trọ.'}
function vHList(){return `<input placeholder="🔍 Tìm nhà trọ theo tên..." value="${esc(S.q||'')}" oninput="S.q=this.value;$('#hl').innerHTML=hl()"><button class='btn w o' style='margin:8px 0 0' onclick='addHouse()'>+ Thêm nhà trọ</button><small style='color:var(--mu);display:block;margin:6px 0'>${H.length} nhà trọ</small><div id='hl'>${hl()}</div>`}

function loadXl(el){const f=el.files[0];if(!f)return;if(!/\.(xlsx|xls|csv)$/i.test(f.name))return toast("Chọn file .xlsx, .xls hoặc .csv");if(typeof XLSX=="undefined")return toast("Chưa tải được thư viện đọc Excel, kiểm tra mạng");const rd=new FileReader();rd.onload=e=>{try{const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});S.up={nm:f.name,wb,sheet:wb.SheetNames[0]};readSheet();if(!S.up.head.length)throw 0;S.mh="";S.xlI=-1;S.xl=null;render();toast("Đã đọc "+S.up.data.length+" dòng")}catch(x){toast("Không đọc được file này")}};rd.readAsArrayBuffer(f)}

function findH(name){const n=norm(name).trim();let i=H.findIndex(h=>{const a=norm(h[0]).trim();return a==n||a.includes(n)||n.includes(a)});if(i<0){H.push([name,10]);i=H.length-1}return i}
function houseInfo(c){const m=S.xl.findIndex(d=>d[0]=='house');const inp=`<input list='hdl' placeholder='VD: Nhà trọ Hoa Mai' value="${esc(S.mh||'')}" oninput='S.mh=this.value' style='margin-top:6px'><datalist id='hdl'>${H.map(h=>`<option value="${esc(h[0])}">`).join('')}</datalist>`;
if(m>=0){const v=[...new Set(c.data.map(r=>String(r[m]||'').trim()).filter(Boolean))];return `Nhà trọ lấy từ cột <b>${esc(c.head[m])}</b>: ${v.length} cơ sở${v.length?' ('+esc(v.slice(0,3).join(', '))+(v.length>3?'...':'')+')':''}. Cơ sở chưa có trong app sẽ được tạo mới.<br><small style='color:var(--mu)'>Tên dùng cho dòng bị trống (nếu có):</small>${inp}`}
return `<b class='bad'>Không nhận ra cột tên nhà trọ.</b> Chọn lại cột trong bảng trên (Tên nơi ở) hoặc nhập tên nhà trọ thủ công:${inp}`}
function doImport(){const c=cur(),m={};S.xl.forEach((d,i)=>{if(d[0]!='skip'&&!(d[0] in m))m[d[0]]=i});
if(m.name==null||m.id==null)return toast('Cần có cột Họ tên và Số định danh');if(m.house==null&&!(S.mh||'').trim())return toast('Nhập tên nhà trọ ở ô phía trên');
let add=0,dup=0,bad=0,nh=H.length,last=S.h;const g=(r,k)=>m[k]==null?'':String(r[m[k]]||'').trim();
c.data.forEach(r=>{const n=g(r,'name');let cc=g(r,'id').replace(/\D/g,'');if(cc.length==11)cc='0'+cc;if(!n||cc.length!=12){bad++;return}
const hn=hname(c,m,r);if(!hn){bad++;return}const hi=findH(hn),ht=normHt(g(r,'htype'));if(ht)H[hi][2]=ht;const old=P.find(p=>p.cc==cc&&p.tt=='Đang cư trú');if(old&&old.h==hi){dup++;return}
if(old){old.tt='Đã rời đi';old.hist.push({d:'17/10/2026',t:'Chuyển đi, sang '+H[hi][0]})}
const rm=parseInt(g(r,'room').replace(/\D/g,''))||0;if(rm>H[hi][1]&&rm<=60)H[hi][1]=rm;last=hi;
P.push({id:P.length+1,n,cc,dob:nd(g(r,'dob')),g:/nữ|nu/i.test(g(r,'gender'))?'Nữ':'Nam',h:hi,r:rm<=H[hi][1]?rm:0,loai:/khai/i.test(g(r,'type'))?K:T,dc:false,fl:!!old,note:old?'Từng ở '+H[old.h][0]:'',...(A=>({pv:A.pv,xa:A.xa,ap:A.ap,ct:A.ct,ad:A.full}))(mkAddr(r,g)),tt:/rời|chuyển/i.test(g(r,'status'))?'Đã rời đi':'Đang cư trú',hist:[{d:nd(g(r,'arrive'))||'—',t:'Nhập từ '+c.nm}]});add++});
S.h=last;S.open=true;S.sel=new Set();S.tab=1;render();toast('Đã nhập '+add+' · trùng '+dup+' · lỗi '+bad+(H.length>nh?' · thêm '+(H.length-nh)+' nhà trọ':''))}
function doImport3Old(){const c=cur(),m={};S.xl.forEach((d,i)=>{if(d[0]!="skip"&&!(d[0] in m))m[d[0]]=i});
if(m.name==null||m.id==null)return toast("Cần có cột Họ tên và Số định danh");
let add=0,dup=0,bad=0,nh=H.length,last=S.h;const g=(r,k)=>m[k]==null?"":String(r[m[k]]||"").trim();
c.data.forEach(r=>{const n=g(r,"name");let cc=g(r,"id").replace(/\D/g,"");if(cc.length==11)cc="0"+cc;if(!n||cc.length!=12){bad++;return}
const hi=findH(hname(c,m,r));const old=P.find(p=>p.cc==cc&&p.tt=="Đang cư trú");if(old&&old.h==hi){dup++;return}
if(old){old.tt="Đã rời đi";old.hist.push({d:"17/10/2026",t:"Chuyển đi, sang "+H[hi][0]})}
const rm=parseInt(g(r,"room").replace(/\D/g,""))||0;if(rm>H[hi][1]&&rm<=60)H[hi][1]=rm;last=hi;
P.push({id:P.length+1,n,cc,dob:g(r,"dob"),g:/nữ|nu/i.test(g(r,"gender"))?"Nữ":"Nam",h:hi,r:rm<=H[hi][1]?rm:0,loai:/khai/i.test(g(r,"type"))?K:T,dc:false,fl:!!old,note:old?"Từng ở "+H[old.h][0]:"",ad:addr(g(r,"addr")).full||g(r,"addr"),tt:/rời|chuyển/i.test(g(r,"status"))?"Đã rời đi":"Đang cư trú",hist:[{d:g(r,"arrive")||"—",t:"Nhập từ "+c.nm}]});add++});
S.h=last;S.tab=1;render();toast(`Đã nhập ${add} · trùng ${dup} · lỗi ${bad}`+(H.length>nh?` · thêm ${H.length-nh} nhà trọ`:""))}
function doImportOld(){const c=cur(),m={};S.xl.forEach((d,i)=>{if(d[0]!="skip"&&!(d[0] in m))m[d[0]]=i});
if(m.name==null||m.id==null)return toast("Cần có cột Họ tên và Số định danh");
let add=0,dup=0,bad=0;const g=(r,k)=>m[k]==null?"":String(r[m[k]]||"").trim();
c.data.forEach(r=>{const n=g(r,"name");let cc=g(r,"id").replace(/\D/g,"");if(cc.length==11)cc="0"+cc;if(!n||cc.length!=12){bad++;return}
const old=P.find(p=>p.cc==cc&&p.tt=="Đang cư trú");if(old&&old.h==S.h){dup++;return}
if(old){old.tt="Đã rời đi";old.hist.push({d:"17/10/2026",t:"Chuyển đi, sang "+H[S.h][0]})}
const rm=parseInt(g(r,"room").replace(/\D/g,""))||0;
P.push({id:P.length+1,n,cc,dob:g(r,"dob"),g:/nữ|nu/i.test(g(r,"gender"))?"Nữ":"Nam",h:S.h,r:rm>=1&&rm<=H[S.h][1]?rm:0,loai:/khai/i.test(g(r,"type"))?K:T,dc:false,fl:!!old,note:old?"Từng ở "+H[old.h][0]:"",ad:addr(g(r,"addr")).full||g(r,"addr"),tt:/rời|chuyển/i.test(g(r,"status"))?"Đã rời đi":"Đang cư trú",hist:[{d:g(r,"arrive")||"—",t:"Nhập từ "+c.nm}]});add++});
S.tab=1;render();toast("Đã nhập "+add+" · trùng "+dup+" · lỗi/thiếu "+bad)}
function vXl(){const c=cur();if(!S.xl)S.xl=c.head.map((h,i)=>{const v=(c.data.find(r=>String(r[i]||"").trim())||[])[i]||"";return detect(h,String(v).trim())});
const smp=i=>String((c.data.find(r=>String(r[i]||"").trim())||[])[i]||"");
return `<label class="btn w" style="position:relative;display:block;text-align:center;margin:0 0 8px;color:#fff;overflow:hidden">📂 Chọn file Excel (có thể không mở được trong app Claude, hãy dán dữ liệu ở dưới)<input type="file" onchange="loadXl(this)" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0"></label>
<div class="card"><h3>Hoặc dán dữ liệu từ Excel</h3><small style="color:var(--mu)">Trong Excel hoặc Google Sheets: chọn vùng dữ liệu (gồm dòng tiêu đề), sao chép, rồi dán vào ô dưới.</small><textarea id="pt" rows="4" placeholder="Dán dữ liệu vào đây"></textarea><label>Tên nhà trọ (bỏ trống nếu dữ liệu đã có cột Tên cơ sở)</label><input id="pn" placeholder="VD: Nhà trọ Hoa Mai"><button class="btn w" onclick="pasteXl()">Đọc dữ liệu đã dán</button></div>
<div class="chips">${S.up?`<button class="chip ${S.xlI<0?"on":""}" onclick="S.xlI=-1;S.xl=null;render()">${esc(S.up.nm)}</button>`:""}${FILES.map((x,i)=>`<button class="chip ${S.xlI==i?"on":""}" onclick="S.xlI=${i};S.xl=null;render()">${x.nm} (mẫu)</button>`).join("")}</div>
${S.up&&S.xlI<0&&S.up.wb.SheetNames.length>1?`<label>Sheet</label><select onchange="S.up.sheet=this.value;readSheet();S.xl=null;render()">${S.up.wb.SheetNames.map(s=>`<option ${s==S.up.sheet?"selected":""}>${esc(s)}</option>`).join("")}</select>`:""}
<small style="color:var(--mu);display:block;margin-top:6px">${esc(c.nm)}: ${c.data.length} dòng dữ liệu${S.xlI<0?", tiêu đề ở dòng "+S.up.hi:""}. App đọc tiêu đề và nội dung để đoán cột, bạn có thể sửa.</small>
<div class="card" style="margin-top:8px;overflow-x:auto"><table><tr><th>Cột Excel</th><th>Mẫu</th><th>Nhận diện</th></tr>${c.head.map((h,i)=>{const d=S.xl[i];return `<tr><td>${esc(h)}</td><td>${esc(smp(i)).slice(0,28)}</td><td><select onchange="S.xl[${i}]=[this.value,100,'bạn chọn'];render()">${Object.keys(FL).map(k=>`<option value="${k}" ${d[0]==k?"selected":""}>${FL[k]}</option>`).join("")}</select><small class="${d[1]>=80?"ok":"bad"}">${d[1]}% · ${d[2]}</small></td></tr>`}).join("")}</table></div>
<div class="card" style="font-size:13px;margin-top:8px">${houseInfo(c)}</div>
<button class="btn w" onclick="doImport()">Nhập ${c.data.length} dòng</button><small style="color:var(--mu);display:block;margin-top:6px">Dòng thiếu họ tên hoặc số định danh sẽ bị bỏ qua. Người đã đang ở đúng nhà này được tính là trùng. Người đang ở nhà khác sẽ được chuyển nhà và đánh dấu nổi bật.</small>`}
function vXlOld(){const f=FILES[S.xlI];if(!S.xl)S.xl=f.rows[0].map((h,i)=>detect(h,f.rows[1][i]));
return `<div class="chips">${FILES.map((x,i)=>`<button class="chip ${S.xlI==i?"on":""}" onclick="S.xlI=${i};S.xl=null;render()">${x.nm}</button>`).join("")}</div>
<small style="color:var(--mu)">Mỗi file có thứ tự cột khác nhau. App đọc tiêu đề và nội dung để đoán cột.</small>
<div class="card" style="margin-top:8px"><table><tr><th>Cột Excel</th><th>Mẫu</th><th>Nhận diện</th></tr>${f.rows[0].map((h,i)=>{const d=S.xl[i];return `<tr><td>${esc(h)}</td><td>${esc(f.rows[1][i])}</td><td><select onchange="S.xl[${i}]=[this.value,100,'bạn chọn'];render()">${Object.keys(FL).map(k=>`<option value="${k}" ${d[0]==k?"selected":""}>${FL[k]}</option>`).join("")}</select><small class="${d[1]>=80?"ok":"bad"}">${d[1]}% · ${d[2]}</small></td></tr>`}).join("")}</table></div>
<button class="btn w" onclick="toast('Demo: bản thật sẽ nhập tất cả dòng, báo lỗi theo dòng và lưu mẫu cột cho nhà này')">Nhập dữ liệu</button>`}
function dlist(){const q=norm(S.dq||'');return act().filter(p=>(S.dcT?p.dc:!p.dc)&&(S.dch<0||p.h==S.dch)&&(!q||norm(p.n+' '+p.cc).includes(q)))}
function dHtml(){return dlist().map(p=>`<div class='p ${p.fl?'flag':''}'><input type='checkbox' class='ck' value='${p.id}' onchange='updC()' style='width:20px;height:20px;margin-top:8px;flex:none'><div class='t' onclick='detail(${p.id})'><b>${esc(p.n)}</b>${p.fl?' ⚠️':''}<small>${esc(H[p.h][0])} · ${p.r?'P'+p.r:'chờ xếp phòng'}</small></div></div>`).join('')||'Không có ai trong danh sách này.'}
function updC(){const a=[...document.querySelectorAll('.ck')],n=a.filter(c=>c.checked).length,e=$('#dcn'),all=$('#dca');if(e)e.textContent='Đã chọn: '+n+'/'+a.length;if(all)all.checked=a.length>0&&n==a.length}
function dAll(on){document.querySelectorAll('.ck').forEach(c=>c.checked=on);updC()}
function dRef(){$('#dl').innerHTML=dHtml();updC()}
function vDc(){return `<div class="seg"><button class="${S.dcT==0?"on":""}" onclick="S.dcT=0;render()">Chưa nhập DC (${act().filter(p=>!p.dc).length})</button><button class="${S.dcT==1?"on":""}" onclick="S.dcT=1;render()">Đã nhập DC (${act().filter(p=>p.dc).length})</button></div>
<select onchange="S.dch=+this.value;dRef()"><option value="-1">Tất cả nhà trọ</option>${H.map((h,i)=>`<option value="${i}" ${S.dch==i?"selected":""}>${esc(h[0])}</option>`).join("")}</select>
<input style="margin-top:8px" placeholder="🔍 Tìm theo tên, CCCD..." value="${esc(S.dq||"")}" oninput="S.dq=this.value;dRef()">
<div class="row" style="margin:10px 0"><label style="display:flex;align-items:center;gap:8px;margin:0;flex:1;color:var(--ink)"><input type="checkbox" id="dca" style="width:20px;height:20px" onchange="dAll(this.checked)"> Chọn tất cả</label><b id="dcn"></b></div>
<div class="card" id="dl">${dHtml()}</div>
<button class="btn w" onclick="bulk()">${S.dcT?"Chuyển về chưa nhập DC":"Đánh dấu đã nhập DC"}</button>`}
function bulk(){const c=[...document.querySelectorAll(".ck:checked")].map(x=>+x.value);if(!c.length)return toast("Chọn ít nhất một người");P.forEach(p=>{if(c.includes(p.id))p.dc=!S.dcT});render();toast("Đã cập nhật "+c.length+" người")}
S.dch=-1;S.dq='';S.mh='';
function resetAll(){if(confirm('Xóa toàn bộ nhà trọ và nhân khẩu hiện có?')){P=[];H.length=0;S.open=false;S.sel=new Set();render()}}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script></body></html>
