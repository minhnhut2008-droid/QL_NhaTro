<style>
:root{--bg:#eef2f1;--sf:#fff;--ink:#16231f;--mu:#5d6f69;--ln:#d5dedb;--pr:#0f6e5a;--pr2:#dff0ec;--am:#d9a21b;--am2:#fbf0d2;--rd:#c4423b;--rd2:#f9e0de;--gn2:#e3f1e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1815;--sf:#18241f;--ink:#e6efec;--mu:#98aba5;--ln:#2b3b36;--pr:#4cc2a5;--pr2:#17332c;--am:#e8b53a;--am2:#3a3015;--rd:#ef7a73;--rd2:#3d1f1d;--gn2:#1e3320}}
*{box-sizing:border-box}html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Be Vietnam Pro",system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
header{padding:12px 16px 8px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1}header small{color:var(--mu)}
main{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 14px 16px}
nav{display:flex;background:var(--sf);border-top:1px solid var(--ln)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:8px 0 7px;font:inherit;font-size:10px;min-width:0;cursor:pointer}
nav button b{display:block;font-size:17px;font-weight:400}
nav button.on{color:var(--pr);font-weight:700;box-shadow:inset 0 2px var(--pr)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px}
.stat b{font-size:26px;display:block;line-height:1.1}.stat span{color:var(--mu);font-size:12.5px}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12.5px}
.bar i{flex:0 0 105px;font-style:normal;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar u{height:14px;background:var(--pr);border-radius:3px;display:block;text-decoration:none}
.donut{width:92px;height:92px;border-radius:50%;flex:none;position:relative}
.donut:after{content:"";position:absolute;inset:22px;background:var(--sf);border-radius:50%}
.row{display:flex;align-items:center;gap:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
.chip{flex:none;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:18px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--pr);border-color:var(--pr);color:#fff}
.seg{display:flex;border:1px solid var(--ln);border-radius:8px;overflow:hidden;margin-bottom:8px}
.seg button{flex:1;border:0;background:var(--sf);color:var(--ink);padding:7px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--pr);color:#fff}
.rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.room b{font-size:15px;display:block}
.room.has{background:var(--pr2);border-color:var(--pr)}
.room.nodc{border-color:var(--rd);background:var(--rd2)}
.room.flag{box-shadow:inset 4px 0 var(--am)}
.room.empty{color:var(--mu);border-style:dashed}
.p{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.p:last-child{border:0}.p.flag{background:var(--am2);margin:0 -12px;padding:10px 12px;border-left:4px solid var(--am)}
.av{width:36px;height:36px;border-radius:50%;background:var(--pr2);color:var(--pr);display:grid;place-items:center;font-weight:700;flex:none}
.p div.t{flex:1;min-width:0}.p small{color:var(--mu);display:block}
.tag{display:inline-block;font-size:11px;border-radius:4px;padding:1px 6px;margin-right:4px}
.t-ok{background:var(--gn2);color:var(--pr)}.t-no{background:var(--rd2);color:var(--rd)}.t-fl{background:var(--am2);color:var(--am)}
.btn{border:0;background:var(--pr);color:#fff;border-radius:8px;padding:10px 14px;font:inherit;font-weight:500;cursor:pointer}
.btn.o{background:none;color:var(--pr);border:1px solid var(--pr)}.btn.w{width:100%;margin-top:8px}
label{display:block;font-size:12.5px;color:var(--mu);margin:8px 0 3px}
select,input,textarea{width:100%;font:inherit;padding:8px;border:1px solid var(--ln);border-radius:8px;background:var(--sf);color:var(--ink)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet.on{display:flex}.sheet>div{overscroll-behavior:contain;background:var(--bg);width:100%;max-width:520px;max-height:88%;overflow-y:auto;border-radius:14px 14px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px))}
.tl{border-left:2px solid var(--ln);margin-left:6px;padding-left:12px}.tl div{margin-bottom:8px;font-size:13px;position:relative}
.tl div:before{content:"";position:absolute;left:-18px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--pr)}
table{width:100%;border-collapse:collapse;font-size:12.5px}td,th{padding:5px 4px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:middle}
td select{padding:3px;font-size:12px}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13px;display:none;z-index:20}
.sc{aspect-ratio:1.6;border:2px dashed var(--pr);border-radius:12px;display:grid;place-items:center;color:var(--mu);text-align:center;margin-bottom:8px}
.ok{color:var(--pr)}.bad{color:var(--rd)}
#lk{overscroll-behavior:contain;position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:max(16px,env(safe-area-inset-top)) 16px 24px;display:none}#lk>div{max-width:420px;margin:7vh auto 0}</style></head><body>
<div id="app"><header><h1 id="ttl">Tổng quan</h1><small>Lưu trên máy · chạy offline</small></header><main id="main"></main>
<nav id="nav"></nav></div>
<div class="sheet" id="sh"><div id="shc"></div></div><div class="toast" id="ts"></div><div id="lk"></div>

<script>
const H=[["Nhà trọ Hoa Mai",8],["Nhà trọ Bình An",6],["Nhà nghỉ Sao Mai",9],["Nhà cho thuê Phú Gia",6]];
const T="Tạm trú",K="Khai báo nơi ở hiện tại";
const CAT={};
const ptype=p=>p.startsWith("Thành phố")?"":"Tỉnh ";
let P=[
["Nguyễn Văn Hùng","066201012345","12/03/2001","Nam",0,1,T,1,0,"","Ấp 3, Xã Bình Hòa, Tỉnh Đồng Nai"],
["Trần Thị Mai","079199008761","25/07/1999","Nữ",0,1,K,1,0,"","Xã Tân Lập, Tỉnh Đắk Lắk"],
["Lê Quốc Bảo","086203004412","02/11/2003","Nam",0,2,T,0,1,"Giấy tờ chưa đủ, cần nhắc","Xã Cư Êbur, Tỉnh Đắk Lắk"],
["Phạm Thanh Tùng","072198003377","09/05/1998","Nam",1,1,T,1,0,"","Xã Long Thuận, Tỉnh Tây Ninh"],
["Võ Thị Lan","048200005519","30/01/2000","Nữ",1,1,T,0,0,"","Phường Long Xuyên, Tỉnh An Giang"],
["Đặng Minh Khoa","064202007788","17/09/2002","Nam",1,3,K,1,0,"","Phường Ea Kao, Tỉnh Đắk Lắk"],
["Hoàng Anh Thư","092199011234","11/12/1999","Nữ",2,4,T,0,1,"Từng ở nhiều nhà trọ","Phường Bến Thành, Thành phố Hồ Chí Minh"],
["Bùi Văn Nam","075197006621","05/06/1997","Nam",2,4,T,1,0,"","Xã Phú Lý, Tỉnh Đồng Nai"],
["Ngô Thị Hạnh","051201009900","21/04/2001","Nữ",2,7,K,0,0,"","Phường Gia Lộc, Tỉnh Tây Ninh"],
["Đỗ Quang Vinh","038200003210","14/08/2000","Nam",3,1,T,1,0,"","Xã Mỹ Hòa Hưng, Tỉnh An Giang"],
["Mai Thị Cúc","080199004455","03/03/1999","Nữ",3,2,K,0,0,"","Xã Bình Chánh, Thành phố Hồ Chí Minh"]
].map((a,i)=>({id:i,n:a[0],cc:a[1],dob:a[2],g:a[3],h:a[4],r:a[5],loai:a[6],dc:!!a[7],fl:!!a[8],note:a[9],ad:a[10],tt:"Đang cư trú",hist:[{d:"01/09/2026",t:"Đến "+H[a[4]][0]+", phòng P"+a[5]}]}));
P.push({id:11,n:"Trương Văn Đức",cc:"070200008899",dob:"08/02/2000",g:"Nam",h:0,r:3,loai:T,dc:true,fl:false,note:"",ad:"Xã Tân Lập, Tỉnh Đắk Lắk",tt:"Đã rời đi",hist:[{d:"01/06/2026",t:"Đến Nhà trọ Hoa Mai, phòng P3"},{d:"30/09/2026",t:"Rời đi"}]});
try{const d=localStorage.getItem('nt_vault')?null:JSON.parse(localStorage.getItem('nt_v1')||'null');if(d&&d.P&&d.H){H.length=0;d.H.forEach(x=>H.push(x));P=d.P;if(d.CAT)Object.keys(d.CAT).forEach(k=>CAT[k]=d.CAT[k])}else{H.length=0;P=[]}}catch(e){}
try{const c=JSON.parse(localStorage.getItem('nt_cat2')||'null');if(c&&c.d)applyCat(c.d)}catch(e){}
function save(){if(!DEK)return;clearTimeout(svT);svT=setTimeout(()=>flush().catch(()=>{}),400)}
let S={sel:new Set(),open:false,q:'',pq:'',tab:0,h:0,view:"map",dcT:0,order:"pre",scan:null,xl:null,xlI:0};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/gi,"d").toLowerCase().replace(/[^a-z0-9, ]/g," ").replace(/\s+/g," ");
const strip=s=>norm(s).replace(/^(xa|phuong|dac khu|tinh|thanh pho|tp|t|x|p)\s+/,"");
function addr(raw){const n=norm(raw);let pv=null,xa=null,miss=[];
const nn=' '+n.replace(/,/g,' ').replace(/\s+/g,' ')+' ',hit=q=>nn.includes(' '+strip(q)+' ');
for(const k in CAT)if(hit(k)&&(!pv||strip(k).length>strip(pv).length))pv=k;
if(!pv){const c=[];for(const k in CAT)for(const x of CAT[k])if(strip(x).length>=4&&hit(x))c.push(k);if(c.length==1)pv=c[0]}
if(pv)for(const x of CAT[pv])if(hit(x)&&(!xa||strip(x).length>strip(xa).length))xa=x;
const rest=raw.split(",").map(s=>s.trim()).filter(s=>s&&(!pv||!norm(s).includes(strip(pv)))&&(!xa||!norm(s).includes(strip(xa))));
if(!pv)miss.push("Tỉnh/Thành phố");if(!xa)miss.push("Xã/Phường/Đặc khu");
return{pv:pv?ptype(pv)+pv:"",xa:xa||"",rest:rest.join(", "),miss,full:[rest.join(", "),xa,pv?ptype(pv)+pv:""].filter(Boolean).join(", "),raw}}
const inH=h=>P.filter(p=>p.h==h&&p.tt=="Đang cư trú"),act=()=>P.filter(p=>p.tt=="Đang cư trú");
function toast(t,ms){const e=$("#ts");e.textContent=t;e.style.display="block";clearTimeout(window._tt);window._tt=setTimeout(()=>e.style.display="none",ms||2200)}
let prevSheet=null,skipPop=false,sheetH=false;
function open_(h){$("#shc").innerHTML=h;if(!sheetH){sheetH=true;history.pushState({sh:1},'')}$("#sh").classList.add("on")}
function close_(pop){$("#sh").classList.remove("on");prevSheet=null;window._rsr=null;if(sheetH){sheetH=false;if(!pop){skipPop=true;history.back()}}}
function sheetBack(){if(prevSheet){const f=prevSheet;prevSheet=null;f()}else close_()}
function backH(){if(history.state&&history.state.h)history.back();else{S.open=false;render()}}
window.addEventListener('popstate',()=>{if(skipPop){skipPop=false;return}if($('#sh').classList.contains('on'))close_(true);else if(S.open&&S.tab==1){S.open=false;render()}});
$("#sh").onclick=e=>{if(e.target.id=="sh")close_()};
const TABS=[["▦","Tổng quan"],["⌂","Nhà trọ"],["⌗","Quét"],["⇩","Nhập"],["✓","DC"],["⌕","Tìm"],["▤","Thống kê"]],TTL=["Tổng quan","Nhà trọ","Quét CCCD","Nhập Excel","Hệ thống DC","Tìm kiếm nhân khẩu","Thống kê"],NAV=[0,1,5,6,2,3,4];
function nav(){$("#nav").innerHTML=NAV.map(i=>`<button class="${S.tab==i?"on":""}" onclick="go(${i})"><b>${TABS[i][0]}</b>${TABS[i][1]}</button>`).join("")}
function go(i){S.tab=i;render()}
function render(){save();nav();$("#ttl").textContent=TTL[S.tab];$("#main").innerHTML=[vDash,vHouse,vScan,vXl,vDc,vSearch,vStats][S.tab]();$("#main").scrollTop=0;if(S.tab==4)updC()}
function vDash(){const a=act(),nd=a.filter(p=>!p.dc).length,fl=a.filter(p=>p.fl).length,t=a.filter(p=>p.loai==T).length,k=a.length-t;
const mx=Math.max(...H.map((_,i)=>inH(i).length));
return `<div class="grid"><div class="stat"><b>${a.length}</b><span>Người đang cư trú</span></div><div class="stat"><b>${H.length}</b><span>Nhà trọ (mẫu)</span></div>
<div class="stat" style="border-color:var(--rd)"><b class="bad">${nd}</b><span>Chưa nhập hệ thống DC</span></div><div class="stat" style="border-color:var(--am)"><b>${fl}</b><span>Đang được đánh dấu</span></div></div>
<div class="card" style="margin-top:10px"><h3>Số người theo nhà trọ</h3>${H.map((h,i)=>`<div class="bar"><i>${h[0]}</i><u style="width:${inH(i).length/mx*100}%"></u>${inH(i).length}</div>`).join("")}</div>
<div class="card"><h3>Loại cư trú</h3><div class="row"><div class="donut" style="background:conic-gradient(var(--pr) 0 ${t/(a.length||1)*100}%,var(--am) 0)"></div><div style="font-size:13px"><span class="tag t-ok">Tạm trú</span> ${t} người<br><span class="tag t-fl">Khai báo nơi ở hiện tại</span> ${k} người</div></div></div>
<div class="card"><h3>Đã nhập hệ thống DC theo nhà trọ</h3>${H.map((h,i)=>{const l=inH(i),d=l.filter(p=>p.dc).length;return `<div class="bar"><i>${h[0]}</i><u style="width:${l.length?d/l.length*100:0}%;background:var(--am)"></u>${d}/${l.length}</div>`}).join("")}</div>
${dueCard()}${catCard()}${secCard()}<button class="btn w o" onclick="exportSheet()">Xuất danh sách (Excel / CSV)</button><button class="btn w o" style="color:var(--rd);border-color:var(--rd)" onclick="resetAll()">Xóa toàn bộ dữ liệu trên máy</button>`}
function mkAddr(r,g){const w={pv:g(r,'pv'),xa:g(r,'xa'),ap:g(r,'ap'),ct:g(r,'ct')},one=g(r,'addr');if(!w.pv&&!w.xa&&!w.ap&&!w.ct){const a=addr(one);return{pv:a.pv,xa:a.xa,ap:'',ct:a.rest,full:a.full||one}}const a=addr([w.ct,w.ap,w.xa,w.pv].filter(Boolean).join(', '));const pv=a.pv||w.pv,xa=a.xa||w.xa;return{pv,xa,ap:w.ap,ct:w.ct,full:[w.ct,w.ap,xa,pv].filter(Boolean).join(', ')}}
function nd(s){s=String(s||'').trim();const m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);if(!m)return s;let a=+m[1],b=+m[2],y=m[3],d,mo;const sh=y.length<4;if(sh)y=(+y<=26?2000:1900)+ +y;if(b>12){mo=a;d=b}else if(a>12){d=a;mo=b}else if(sh){mo=a;d=b}else{d=a;mo=b}return String(d).padStart(2,'0')+'/'+String(mo).padStart(2,'0')+'/'+y}
function htype(i){const t=H[i][2];if(t)return t;const n=norm(H[i][0]);return /nghi/.test(n)?'Nhà nghỉ':/cho thue/.test(n)?'Nhà cho thuê':'Nhà trọ'}
function normHt(s){const n=norm(s);return /nghi/.test(n)?'Nhà nghỉ':/thue/.test(n)?'Nhà cho thuê':/tro/.test(n)?'Nhà trọ':''}
function pr(p,show,sel){const on=S.sel.has(p.id);return `<div class='p ${p.fl?'flag':''}' onclick='detail(${p.id})'>${sel?`<input type='checkbox' ${on?'checked':''} onclick='event.stopPropagation()' onchange='tsel(${p.id},this.checked)' style='width:20px;height:20px;margin-top:8px;flex:none'>`:''}<div class='av'>${p.n.split(' ').pop()[0]}</div><div class='t'><b>${esc(p.n)}</b>${p.fl?' ⚠️':''}<small>${p.g} · ${nd(p.dob)} · ${p.cc.slice(0,3)}•••••${p.cc.slice(-3)}</small><small>${show==2?esc(H[p.h][0])+' · ':''}${show&&p.r?'P'+p.r+' · ':''}${p.loai}</small>${p.di&&p.tt=='Đang cư trú'?`<small ${overdue(p)?"style='color:var(--rd)'":''}>Dự kiến đi: ${nd(p.di)}${overdue(p)?' (quá hạn)':''}</small>`:''}<span class='tag ${p.dc?'t-ok':'t-no'}'>${p.dc?'Đã nhập DC':'Chưa nhập DC'}</span>${p.note?`<small>📝 ${esc(p.note)}</small>`:''}</div></div>`}
function keep(f){const m=$('#main'),st=m.scrollTop;f();m.scrollTop=st}
function tsel(id,on){on?S.sel.add(id):S.sel.delete(id);keep(render)}
function plist(){const q=norm(S.pq||'');return inH(S.h).filter(p=>!q||norm(p.n+' '+p.cc+' p'+p.r).includes(q)).sort((a,b)=>(a.r||99)-(b.r||99))}
function plHtml(){return plist().map(p=>pr(p,1,true)).join('')||'Không có kết quả.'}
function selAll(on){plist().forEach(p=>on?S.sel.add(p.id):S.sel.delete(p.id));keep(render)}
function bulkAct(k){if(!S.sel.size)return toast('Chọn ít nhất một người');const n=S.sel.size;if(k=='exp')return xport(P.filter(p=>S.sel.has(p.id)),'xlsx','nhan-khau-da-chon');P.forEach(p=>{if(!S.sel.has(p.id))return;if(k=='dc')p.dc=true;if(k=='fl')p.fl=true;if(k=='out'){p.tt='Đã rời đi';p.hist.push({d:tday(),t:'Rời đi'})}});S.sel=new Set();render();toast('Đã cập nhật '+n+' người')}
function prOld(p,show){return `<div class="p ${p.fl?"flag":""}" onclick="detail(${p.id})"><div class="av">${p.n.split(" ").pop()[0]}</div><div class="t"><b>${esc(p.n)}</b>${p.fl?" ⚠️":""}<small>${show?"Phòng P"+p.r+" · ":""}${p.cc.slice(0,3)}•••••${p.cc.slice(-3)} · ${p.loai==T?"Tạm trú":"Khai báo"}</small><span class="tag ${p.dc?"t-ok":"t-no"}">${p.dc?"Đã nhập DC":"Chưa nhập DC"}</span>${p.note?`<small>📝 ${esc(p.note)}</small>`:""}</div></div>`}
function vHouse(){return S.open?vHOpen():vHList()}

async function mkVault(pw,dek){const s=rnd(16),rs=rnd(16),rc=mkRC();return{V:{it:IT,s:b64(s),w:await wrapK(dek,await kek(pw,s,IT)),rs:b64(rs),rw:await wrapK(dek,await kek(normRC(rc),rs,IT))},rc}}
async function flush(){clearTimeout(svT);if(DEK)localStorage.setItem('nt_data',await encD({H,P,CUS,MAPS,GEO},DEK))}
function load(d){H.length=0;(d.H||[]).forEach(x=>H.push(x));P=d.P||[];if(d.CUS){CUS=d.CUS;applyCat(CUS)}MAPS=d.MAPS||{};GEO=d.GEO||{pv:'',xa:''}}
const getLock=()=>{try{return JSON.parse(localStorage.getItem('nt_lock')||'{"f":0,"u":0}')}catch(e){return{f:0,u:0}}},setLock=o=>localStorage.setItem('nt_lock',JSON.stringify(o));

function failLock(msg){const f=getLock();f.f++;const d=f.f<5?0:[30,60,300,900,3600][Math.min(f.f-5,4)]*1000;f.u=d?Date.now()+d:0;setLock(f);lkMsg((msg||'Mật khẩu không đúng.')+(f.f<5?' Còn '+(5-f.f)+' lần thử trước khi bị khóa tạm.':''));lkTick()}

const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('nt_sess',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function sessTouch(force){if(!DEK||(!force&&Date.now()-lastTouch<5000))return;lastTouch=Date.now();try{if(!SK)SK=DEK.extractable?await crypto.subtle.importKey('raw',await crypto.subtle.exportKey('raw',DEK),{name:'AES-GCM'},false,['encrypt','decrypt']):DEK;(await idb()).transaction('s','readwrite').objectStore('s').put({k:SK,t:Date.now()},'cur')}catch(e){}}
async function sessGet(){try{const d=await idb();return await new Promise(ok=>{const r=d.transaction('s').objectStore('s').get('cur');r.onsuccess=()=>ok(r.result||null);r.onerror=()=>ok(null)})}catch(e){return null}}
async function sessDel(){try{(await idb()).transaction('s','readwrite').objectStore('s').delete('cur')}catch(e){}}

if(localStorage.getItem('nt_vault')){$('#lk').style.display='block';$('#lk').innerHTML='<div><div class="card">Đang mở...</div></div>';const z=await sessGet();if(z&&Date.now()-z.t<60000){try{const raw=localStorage.getItem('nt_data');load(raw?await decD(raw,z.k):{});DEK=z.k;SK=z.k;return enter()}catch(e){sessDel()}}lkUI('unlock')}else lkUI('setup')}

async function doSetup(){const p=$('#lp1').value,q=$('#lp2').value;if(!pwOk(p))return lkMsg('Mật khẩu cần tối thiểu 8 ký tự, gồm cả chữ và số.');if(p!=q)return lkMsg('Hai mật khẩu chưa giống nhau.');lkMsg('Đang mã hóa, vui lòng chờ...');try{const dek=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']),{V,rc}=await mkVault(p,dek);localStorage.setItem('nt_vault',JSON.stringify(V));localStorage.setItem('nt_data',await encD({H,P,CUS,MAPS,GEO},dek));localStorage.removeItem('nt_v1');DEK=dek;lkUI('code',rc,true)}catch(e){lkMsg('Không tạo được khóa mã hóa trên máy này.')}}
async function doUnlock(){if(getLock().u>Date.now())return lkTick();const p=$('#lp').value;if(!p)return;lkMsg('Đang kiểm tra...');let dek;try{const V=JSON.parse(localStorage.getItem('nt_vault'));dek=await unwrapK(V.w,await kek(p,ub64(V.s),V.it),false)}catch(e){return failLock()}try{const raw=localStorage.getItem('nt_data');load(raw?await decD(raw,dek):{});DEK=dek;setLock({f:0,u:0});enter()}catch(e){lkMsg('Dữ liệu trên máy bị lỗi. Hãy khôi phục từ file sao lưu.')}}
async function doForgot(){if(getLock().u>Date.now())return lkTick();const rc=normRC($('#lr').value),p=$('#lp1').value,q=$('#lp2').value;if(rc.length!=20)return lkMsg('Mã khôi phục gồm 20 ký tự (XXXX-XXXX-XXXX-XXXX-XXXX).');if(!pwOk(p))return lkMsg('Mật khẩu mới cần tối thiểu 8 ký tự, gồm cả chữ và số.');if(p!=q)return lkMsg('Hai mật khẩu chưa giống nhau.');lkMsg('Đang xử lý...');let dek;try{const V=JSON.parse(localStorage.getItem('nt_vault'));dek=await unwrapK(V.rw,await kek(rc,ub64(V.rs),V.it),true)}catch(e){return failLock('Mã khôi phục không đúng.')}
try{const raw=localStorage.getItem('nt_data');if(raw)load(await decD(raw,dek));const{V,rc:r2}=await mkVault(p,dek);localStorage.setItem('nt_vault',JSON.stringify(V));setLock({f:0,u:0});DEK=dek;lkUI('code',r2,true)}catch(e){lkMsg('Không đặt lại được mật khẩu.')}}
async function chPw(){const o=$('#po').value,p=$('#p1').value,q=$('#p2').value;if(!pwOk(p))return toast('Mật khẩu mới cần tối thiểu 8 ký tự, gồm chữ và số',3000);if(p!=q)return toast('Hai mật khẩu mới chưa giống nhau');try{const V=JSON.parse(localStorage.getItem('nt_vault')),dek=await unwrapK(V.w,await kek(o,ub64(V.s),V.it),true),s=rnd(16);V.s=b64(s);V.w=await wrapK(dek,await kek(p,s,V.it));localStorage.setItem('nt_vault',JSON.stringify(V));close_();toast('Đã đổi mật khẩu',3000)}catch(e){toast('Mật khẩu hiện tại không đúng')}}
async function newRC(){const o=$('#po').value;try{const V=JSON.parse(localStorage.getItem('nt_vault')),dek=await unwrapK(V.w,await kek(o,ub64(V.s),V.it),true),rs=rnd(16),rc=mkRC();V.rs=b64(rs);V.rw=await wrapK(dek,await kek(normRC(rc),rs,V.it));localStorage.setItem('nt_vault',JSON.stringify(V));close_();lkUI('code',rc,false)}catch(e){toast('Hãy nhập đúng mật khẩu hiện tại')}}
async function backup(){await flush();dl(new Blob([JSON.stringify({app:'nha-tro',v:1,vault:localStorage.getItem('nt_vault'),data:localStorage.getItem('nt_data')})],{type:'application/json'}),'nha-tro-sao-luu-'+tday().replace(/\//g,'-')+'.json');toast('Đã tải file sao lưu (đã mã hóa)',3000)}
function restore(el){const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(o.app!='nha-tro'||!o.vault||!o.data)throw 0;if(!confirm('Khôi phục sẽ thay toàn bộ dữ liệu hiện có trên máy bằng file sao lưu. Sau đó cần mật khẩu (hoặc mã khôi phục) của file sao lưu. Tiếp tục?'))return;localStorage.setItem('nt_vault',o.vault);localStorage.setItem('nt_data',o.data);setLock({f:0,u:0});location.reload()}catch(e){toast('File sao lưu không hợp lệ')}};r.readAsText(f)}

function sDefault(){return{q:'',h:-1,g:'',tt:'act',dc:'',loai:'',y1:'',y2:'',fl:'',di:''}}
function dparse(s){const m=nd(s||'').match(/^(\d\d)\/(\d\d)\/(\d{4})$/);return m?new Date(+m[3],+m[2]-1,+m[1]):null}
function dday(){const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())}
function overdue(p){const d=dparse(p.di);return !!d&&p.tt=='Đang cư trú'&&d<dday()}
function soon(p,n){const d=dparse(p.di),t=dday();return !!d&&p.tt=='Đang cư trú'&&d>=t&&d-t<=n*864e5}
function ageOf(p){const m=nd(p.dob||'').match(/^(\d\d)\/(\d\d)\/(\d{4})$/);if(!m)return null;const t=new Date(),b=new Date(+m[3],+m[2]-1,+m[1]);let a=t.getFullYear()-b.getFullYear();if(t<new Date(t.getFullYear(),b.getMonth(),b.getDate()))a--;return a>=0&&a<120?a:null}
function dueCard(){const a=act(),od=a.filter(overdue).length,sn=a.filter(p=>soon(p,7)).length;if(!od&&!sn)return'';return `<div class="card" style="border-color:var(--am)"><h3>Hạn dự kiến đi</h3>${od?`<button class="chip" style="color:var(--rd)" onclick="goS('od')">Quá hạn: ${od}</button> `:''}${sn?`<button class="chip" onclick="goS('soon')">Sắp đến hạn (7 ngày): ${sn}</button>`:''}</div>`}

let MAPS={},GEO={pv:'',xa:''};
const fileKey=nm=>norm(String(nm).replace(/\.[^.]+$/,'')).replace(/[0-9]+/g,' ').replace(/\s+/g,' ').trim()||'file',normH=h=>norm(String(h)).trim();
function guessMap(c){const k=fileKey(c.nm),sv=MAPS[k],gen=h=>/^cot \d+$/.test(h);if(sv&&sv.mh&&!S.mh)S.mh=sv.mh;

return detect(h,v)})}

function sMatch(p){const f=S.f;if(f.h>=0&&p.h!=f.h)return false;if(f.g&&(p.g=='Nữ'?'Nữ':'Nam')!=f.g)return false;if(f.tt=='act'&&p.tt!='Đang cư trú')return false;if(f.tt=='out'&&p.tt=='Đang cư trú')return false;if(f.dc=='1'&&!p.dc)return false;if(f.dc=='0'&&p.dc)return false;if(f.loai&&p.loai!=f.loai)return false;const y=+nd(p.dob||'').slice(6)||0;if(f.y1&&y<+f.y1)return false;if(f.y2&&y>+f.y2)return false;if(f.fl&&!p.fl)return false;if(f.di=='od'&&!overdue(p))return false;if(f.di=='soon'&&!soon(p,7))return false;if(f.di=='none'&&p.di)return false;
const hay=norm([p.n,p.cc,nd(p.dob||''),p.g=='Nữ'?'nu nữ':'nam',p.ad,'p'+p.r,H[p.h][0],p.note,p.loai,p.tt,nd(p.di||'')].join(' '));return norm(f.q).split(' ').filter(Boolean).every(t=>hay.includes(t))}

return `<input placeholder="🔍 Tên, năm sinh, số định danh, giới tính, địa chỉ, phòng..." value="${esc(f.q)}" oninput="sUpd('q',this.value)">
<div class="grid" style="margin-top:8px"><select onchange="sUpd('h',+this.value)">${o([[-1,'Tất cả nhà trọ']].concat(H.map((h,i)=>[i,h[0]])),f.h)}</select><select onchange="sUpd('g',this.value)">${o([['','Mọi giới tính'],['Nam','Nam'],['Nữ','Nữ']],f.g)}</select>
<select onchange="sUpd('tt',this.value)">${o([['act','Đang cư trú'],['out','Đã rời đi'],['','Tất cả']],f.tt)}</select><select onchange="sUpd('dc',this.value)">${o([['','Hệ thống DC: tất cả'],['1','Đã nhập DC'],['0','Chưa nhập DC']],f.dc)}</select>
<select onchange="sUpd('loai',this.value)">${o([['','Mọi loại cư trú'],[T,'Tạm trú'],[K,'Khai báo nơi ở']],f.loai)}</select><select onchange="sUpd('di',this.value)">${o([['','Hạn dự kiến đi: tất cả'],['od','Quá hạn'],['soon','Sắp đến hạn (7 ngày)'],['none','Chưa có ngày dự kiến đi']],f.di)}</select>
<input inputmode="numeric" placeholder="Sinh từ năm" value="${esc(f.y1)}" oninput="sUpd('y1',this.value)"><input inputmode="numeric" placeholder="đến năm" value="${esc(f.y2)}" oninput="sUpd('y2',this.value)"></div>
<div class="row" style="margin-top:8px"><label style="display:flex;align-items:center;gap:6px;margin:0;color:var(--ink);flex:1"><input type="checkbox" style="width:20px;height:20px" ${f.fl?'checked':''} onchange="sUpd('fl',this.checked?'1':'')"> Chỉ người được đánh dấu</label><button class="chip" onclick="S.f=sDefault();render()">Xóa bộ lọc</button></div><div id="sr">${sRes()}</div>`}
/* thống kê và biểu đồ */
const PAL=['#0f6e5a','#d9a21b','#c4423b','#4f7cac','#8a6fb0','#6b8e23','#999999'],AG=[['Dưới 18',0,17],['18-24',18,24],['25-34',25,34],['35-44',35,44],['45-54',45,54],['55 trở lên',55,200]],PL={x:'Trong xã',t:'Ngoài xã (trong tỉnh)',o:'Ngoài tỉnh',u:'Chưa rõ địa chỉ','?':'Chưa đặt địa bàn'};
function geoOf(h){const g=(H[h]&&H[h][3])||{};return(g.pv||g.xa)?{pv:g.pv||'',xa:g.xa||''}:{pv:GEO.pv||'',xa:GEO.xa||''}}
function place(p){const r=geoOf(p.h);if(!r.pv&&!r.xa)return'?';const n=' '+norm(p.ad||'').replace(/,/g,' ').replace(/\s+/g,' ')+' ',hit=s=>s&&n.includes(' '+strip(s)+' ');if(r.xa&&hit(r.xa))return'x';if(r.pv&&hit(r.pv))return't';return addr(p.ad||'').pv?'o':'u'}
function xaOpts(pv){const k=Object.keys(CAT).find(x=>strip(x)==strip(pv||'~'));return k?CAT[k].map(x=>`<option value="${esc(x)}">`).join(''):''}
function hgFill(v){const e=$('#hxl');if(e)e.innerHTML=xaOpts(v)}
function stList(){return P.filter(p=>(S.sh<0||p.h==S.sh)&&(S.sall||p.tt=='Đang cư trú'))}
function chDonut(t,o,cl){const k=Object.keys(o).filter(x=>o[x]>0),tot=k.reduce((a,x)=>a+o[x],0);if(!tot)return `<div class="card"><h3>${t}</h3><small style="color:var(--mu)">Chưa có dữ liệu</small></div>`;let a=0;const seg=k.map((x,i)=>{const s=a;a+=o[x]/tot*100;return `${PAL[i%7]} ${s}% ${a}%`}).join(',');return `<div class="card"><h3>${t}</h3><div class="row"><div class="donut" style="background:conic-gradient(${seg})"></div><div style="font-size:13px;flex:1">${k.map((x,i)=>`<div><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${PAL[i%7]};margin-right:6px"></span>${esc(cl?cl[x]:x)}: <b>${o[x]}</b> (${Math.round(o[x]/tot*100)}%)</div>`).join('')}</div></div></div>`}
function chBars(t,o){const k=Object.keys(o),mx=Math.max(1,...k.map(x=>o[x]));return `<div class="card"><h3>${t}</h3>${k.map(x=>`<div class="bar"><i>${esc(x)}</i><u style="width:${o[x]/mx*100}%"></u>${o[x]}</div>`).join('')}</div>`}
function stRows(){return H.map((h,i)=>{const l=P.filter(p=>p.h==i&&(S.sall||p.tt=='Đang cư trú')),c=k=>l.filter(p=>place(p)==k).length;return[h[0],l.length,l.filter(p=>p.g!='Nữ').length,l.filter(p=>p.g=='Nữ').length,c('x'),c('t'),c('o'),c('u')]})}
function xTable(){if(!window.XLSX)return toast('Chưa tải được thư viện Excel');const ws=XLSX.utils.aoa_to_sheet([['Nhà trọ','Tổng','Nam','Nữ','Trong xã','Ngoài xã (trong tỉnh)','Ngoài tỉnh','Chưa rõ địa chỉ']].concat(stRows())),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Thống kê');XLSX.writeFile(wb,'thong-ke-nha-tro-'+tday().replace(/\//g,'-')+'.xlsx')}
function saveGeo(){GEO={pv:$('#gpv').value.trim(),xa:$('#gxa').value.trim()};render();toast('Đã lưu địa bàn mặc định')}
function vStats(){const l=stList(),cnt=(f,keys)=>{const o={};keys.forEach(k=>o[k]=0);l.forEach(p=>{const k=f(p);o[k]=(o[k]||0)+1});return o};
const gd=cnt(p=>p.g=='Nữ'?'Nữ':'Nam',['Nam','Nữ']),ag=cnt(p=>{const a=ageOf(p),g=a==null?null:AG.find(x=>a>=x[1]&&a<=x[2]);return g?g[0]:'Chưa rõ'},AG.map(x=>x[0]).concat('Chưa rõ')),pl=cnt(place,['x','t','o','u']),lo=cnt(p=>p.loai==T?'Tạm trú':'Khai báo nơi ở',['Tạm trú','Khai báo nơi ở']);
const unset=l.length&&l.every(p=>place(p)=='?'),g=S.sh>=0?geoOf(S.sh):GEO;
return `<select onchange="S.sh=+this.value;render()"><option value="-1">Tất cả nhà trọ</option>${H.map((h,i)=>`<option value="${i}" ${S.sh==i?'selected':''}>${esc(h[0])}</option>`).join('')}</select>
<label style="display:flex;align-items:center;gap:8px;color:var(--ink)"><input type="checkbox" style="width:20px;height:20px" ${S.sall?'checked':''} onchange="S.sall=this.checked;render()"> Tính cả người đã rời đi</label>
<div class="stat" style="margin:6px 0 10px"><b>${l.length}</b><span>nhân khẩu trong phạm vi thống kê</span></div>
${chDonut('Giới tính',gd)}${chBars('Độ tuổi',ag)}
${unset?`<div class="card" style="border-color:var(--am)"><b>Chưa đặt địa bàn</b><br><small style="color:var(--mu)">Hãy nhập tỉnh/TP và xã/phường nơi các nhà trọ đang đóng (bên dưới, hoặc riêng cho từng nhà trong nút ✏️ Sửa) để thống kê trong xã, ngoài xã, ngoài tỉnh.</small></div>`:chDonut('Nơi thường trú so với địa bàn nhà trọ',pl,PL)}
${chDonut('Loại cư trú',lo)}
${S.sh<0&&H.length?`<div class="card"><h3>Tổng hợp theo nhà trọ</h3><div style="overflow-x:auto"><table><tr><th>Nhà trọ</th><th>Tổng</th><th>Nam</th><th>Nữ</th><th>Trong xã</th><th>Ngoài xã</th><th>Ngoài tỉnh</th></tr>${stRows().map(r=>`<tr><td>${esc(r[0])}</td>${r.slice(1,7).map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></div><button class="btn w o" onclick="xTable()">Xuất bảng này (Excel)</button></div>`:''}
<div class="card"><h3>Địa bàn mặc định</h3><small style="color:var(--mu)">Dùng cho nhà trọ chưa đặt địa bàn riêng.</small><label>Tỉnh/Thành phố</label><input id="gpv" list="gl" value="${esc(GEO.pv)}" oninput="$('#gxl').innerHTML=xaOpts(this.value)" placeholder="VD: Tây Ninh"><datalist id="gl">${Object.keys(CAT).map(k=>`<option value="${esc(k)}">`).join('')}</datalist><label>Xã/Phường</label><input id="gxa" list="gxl" value="${esc(GEO.xa)}" placeholder="VD: Xã Dương Minh Châu"><datalist id="gxl">${xaOpts(GEO.pv)}</datalist><button class="btn w" onclick="saveGeo()">Lưu</button></div>`}

/* ===== Thông tin nhà trọ: chủ trọ, người quản lý, giấy phép, vị trí, ảnh ===== */
function hinf(i){return H[i][4]||(H[i][4]={})}
const hnat=()=>typeof NATIVE!='undefined'&&NATIVE;
function hSum(i){const f=H[i][4]||{},o=f.owner||{},miss=!(o.n&&o.tel&&f.lic&&f.lic.no);return(o.n?`<small style="display:block;color:var(--mu)">Chủ trọ: ${esc(o.n)}${o.tel?' · '+esc(o.tel):''}</small>`:'')+(miss?`<small style="display:block;color:var(--am)">⚠ Thiếu thông tin chủ trọ hoặc giấy phép</small>`:'')}
function hinfoSheet(i){const f=hinf(i),o=f.owner||{},m=f.mgr||{},l=f.lic||{},g=f.loc||{};window._gacc=null;
const F=(lb,id,v,ex)=>`<label>${lb}</label><input id="${id}" value="${esc(v||'')}" ${ex||''}>`;
const person=(p,x)=>F('Họ và tên',p+'N',x.n)+F('Ngày sinh (dd/mm/yyyy)',p+'D',nd(x.dob||''),'inputmode="numeric" placeholder="VD: 16/07/1985"')+F('Số định danh (CCCD)',p+'C',x.cc,'inputmode="numeric"')+F('Số điện thoại',p+'T',x.tel,'inputmode="tel"')+`<label>Nơi cư trú</label><textarea id="${p}A" rows="2">${esc(x.ad||'')}</textarea>`;
const ph=hnat()&&typeof phSection=='function'?phSection('h',i):`<small style="color:var(--mu)">Thêm ảnh nhà trọ chỉ dùng được trong app Android.</small>`;
open_(`<button class='btn o' style='margin:0 0 8px;padding:6px 12px' onclick='close_()'>← Quay lại</button><h3 style='margin:0 0 6px'>Thông tin nhà trọ</h3>
<div class='card'><h3>Chủ trọ</h3>${person('o',o)}${o.tel?`<a href="tel:${esc(o.tel)}" class="chip" style="display:inline-block;margin-top:8px;text-decoration:none;color:var(--pr)">📞 Gọi chủ trọ</a>`:''}</div>
<div class='card'><div class='row'><h3 style='margin:0;flex:1'>Người quản lý</h3><button class='chip' onclick='hCopy()'>Giống chủ trọ</button></div>${person('m',m)}<label>Đang ở trọ không?</label><select id="mS"><option value="">Chưa rõ</option><option value="1" ${m.stay=='1'?'selected':''}>Có, đang ở trọ</option><option value="0" ${m.stay=='0'?'selected':''}>Không ở trọ</option></select>${F('Phòng đang ở (nếu có)','mR',m.room,'inputmode="numeric"')}${m.tel?`<a href="tel:${esc(m.tel)}" class="chip" style="display:inline-block;margin-top:8px;text-decoration:none;color:var(--pr)">📞 Gọi người quản lý</a>`:''}</div>
<div class='card'><h3>Nhà trọ</h3>${F('Tên nhà trọ','iN',H[i][0])}<label>Loại nơi ở</label><select id="iT">${['Nhà trọ','Nhà nghỉ','Nhà cho thuê'].map(x=>`<option ${htype(i)==x?'selected':''}>${x}</option>`).join('')}</select>${F('Số phòng (không bắt buộc)','iR',H[i][1]||'','inputmode="numeric" placeholder="Hiện có '+roomList(i).length+' phòng có người"')}
<label style="margin-top:12px"><b>Giấy phép kinh doanh</b></label>${F('Số giấy phép','kN',l.no)}${F('Ngày cấp (dd/mm/yyyy)','kD',nd(l.date||''),'inputmode="numeric"')}${F('Nơi cấp','kP',l.place)}${F('Ghi chú','kG',l.note)}
<label style="margin-top:12px"><b>Vị trí nhà trọ</b></label><div class='grid'>${F('Vĩ độ','gLat',g.lat!=null?g.lat:'','inputmode="decimal"')}${F('Kinh độ','gLng',g.lng!=null?g.lng:'','inputmode="decimal"')}</div><small id="gAcc" style="color:var(--mu)">${g.lat!=null?'Lấy ngày '+esc(g.ts||'')+(g.acc?', độ chính xác khoảng '+g.acc+' m':''):'Chưa có vị trí'}</small><div class='grid' style='margin-top:6px'><button class='btn' onclick='hGeo()'>📍 Lấy vị trí hiện tại</button><button class='btn o' onclick='hMap()'>🗺 Mở bản đồ</button></div></div>
${ph}<button class='btn w' onclick='hiSave(${i})'>Lưu thông tin</button>`);if(typeof phGrid=='function'&&hnat())phGrid('h',i)}
function hCopy(){['N','D','C','T','A'].forEach(k=>{const a=$('#o'+k),b=$('#m'+k);if(a&&b)b.value=a.value});toast('Đã chép thông tin chủ trọ sang người quản lý')}
async function hGeo(){toast('Đang lấy vị trí...',30000);try{let c;const G=hnat()&&typeof plug=='function'?plug('Geolocation'):null;if(G){try{await G.requestPermissions()}catch(e){}c=(await G.getCurrentPosition({enableHighAccuracy:true,timeout:20000})).coords}else c=await new Promise((ok,no)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>ok(p.coords),no,{enableHighAccuracy:true,timeout:20000}):no(new Error('no geo')));$('#gLat').value=c.latitude.toFixed(6);$('#gLng').value=c.longitude.toFixed(6);window._gacc=Math.round(c.accuracy||0);$('#gAcc').textContent='Vừa lấy xong, độ chính xác khoảng '+window._gacc+' m';toast('Đã lấy vị trí, bấm Lưu để ghi lại')}catch(e){toast('Không lấy được vị trí. Hãy bật GPS và cấp quyền vị trí cho ứng dụng.',5000)}}
function hMap(){const a=parseFloat($('#gLat').value.replace(',','.')),b=parseFloat($('#gLng').value.replace(',','.'));if(!isFinite(a)||!isFinite(b))return toast('Chưa có vị trí');const url='https://www.google.com/maps?q='+a+','+b;const B=hnat()&&typeof plug=='function'?plug('Browser'):null;if(B)B.open({url}).catch(()=>{});else window.open(url,'_blank')}
function hiSave(i){const g=id=>(($('#'+id)||{}).value||'');const nm=g('iN').trim();if(!nm)return toast('Nhập tên nhà trọ');if(H.some((x,k)=>k!=i&&norm(x[0]).trim()==norm(nm).trim()))return toast('Đã có nhà trọ trùng tên');
const per=p=>({n:g(p+'N').trim(),dob:nd(g(p+'D')),cc:g(p+'C').replace(/\D/g,''),tel:g(p+'T').replace(/[^\d+]/g,''),ad:g(p+'A').trim()}),f=hinf(i),w=[],o=per('o'),m=per('m');m.stay=g('mS');m.room=g('mR').replace(/\D/g,'');
if(o.cc&&o.cc.length!=12)w.push('số định danh chủ trọ chưa đủ 12 số');if(m.cc&&m.cc.length!=12)w.push('số định danh người quản lý chưa đủ 12 số');
const lat=parseFloat(g('gLat').replace(',','.')),lng=parseFloat(g('gLng').replace(',','.')),old=f.loc||{};
if((g('gLat')||g('gLng'))&&!(isFinite(lat)&&isFinite(lng)&&Math.abs(lat)<=90&&Math.abs(lng)<=180))return toast('Vĩ độ, kinh độ chưa hợp lệ (ví dụ 11.3254 và 106.4770)',4000);
f.owner=o;f.mgr=m;f.lic={no:g('kN').trim(),date:nd(g('kD')),place:g('kP').trim(),note:g('kG').trim()};
f.loc=isFinite(lat)&&isFinite(lng)?{lat,lng,acc:window._gacc!=null?window._gacc:(old.lat===lat&&old.lng===lng?old.acc:null),ts:window._gacc!=null||old.lat!==lat||old.lng!==lng?tday():old.ts}:null;
H[i][0]=nm;H[i][1]=parseInt(g('iR'))||0;H[i][2]=g('iT');close_();render();toast(w.length?'Đã lưu. Lưu ý: '+w.join('; '):'Đã lưu thông tin nhà trọ',w.length?5000:2200)}
function xHouses(){if(!window.XLSX)return toast('Chưa tải được thư viện Excel');if(!H.length)return toast('Chưa có nhà trọ');const pc=i=>typeof PHL!='undefined'?PHL.filter(x=>x.kind=='h'&&x.owner==i).length:'';
const rows=[['STT','Tên nhà trọ','Loại nơi ở','Số phòng','Tỉnh/TP (địa bàn)','Xã/Phường (địa bàn)','Chủ trọ - Họ tên','Chủ trọ - Ngày sinh','Chủ trọ - Số định danh','Chủ trọ - SĐT','Chủ trọ - Nơi cư trú','Quản lý - Họ tên','Quản lý - Ngày sinh','Quản lý - Số định danh','Quản lý - SĐT','Quản lý - Nơi cư trú','Quản lý đang ở trọ','Quản lý - Phòng','Số giấy phép KD','Ngày cấp','Nơi cấp','Ghi chú giấy phép','Vĩ độ','Kinh độ','Số ảnh','Số người đang cư trú']].concat(H.map((h,i)=>{const f=h[4]||{},o=f.owner||{},m=f.mgr||{},l=f.lic||{},c=f.loc||{},g=h[3]||{};return[i+1,h[0],htype(i),roomList(i).length,g.pv||'',g.xa||'',o.n||'',nd(o.dob||''),o.cc||'',o.tel||'',o.ad||'',m.n||'',nd(m.dob||''),m.cc||'',m.tel||'',m.ad||'',m.stay=='1'?'Có':m.stay=='0'?'Không':'',m.room||'',l.no||'',nd(l.date||''),l.place||'',l.note||'',c.lat!=null?c.lat:'',c.lng!=null?c.lng:'',pc(i),inH(i).length]}));
const ws=XLSX.utils.aoa_to_sheet(rows),wb=XLSX.utils.book_new(),nm='thong-tin-nha-tro-'+tday().replace(/\//g,'-')+'.xlsx';XLSX.utils.book_append_sheet(wb,ws,'Nhà trọ');if(typeof saveWb=='function')saveWb(wb,nm);else XLSX.writeFile(wb,nm)}

function resetAll(){if(confirm('Xóa toàn bộ nhà trọ và nhân khẩu hiện có?')){P=[];H.length=0;S.open=false;S.sel=new Set();render()}}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
showLock();render();
</script></body></html>
